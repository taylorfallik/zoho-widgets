<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eBook Quotations DEBUG</title>
    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #f5f5f5;
        }
        .debug {
            background: white;
            border: 2px solid #333;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .success { background: #d4edda; border-color: #28a745; }
        .error { background: #f8d7da; border-color: #dc3545; }
        .info { background: #d1ecf1; border-color: #17a2b8; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <h1>🔍 eBooks Widget Debug</h1>
    <div id="output"></div>
    
    <script>
        function log(message, type = 'info') {
            var div = document.createElement('div');
            div.className = 'debug ' + type;
            div.innerHTML = '<strong>' + new Date().toLocaleTimeString() + ':</strong> ' + message;
            document.getElementById('output').appendChild(div);
        }
        
        log('Widget started');
        
        if (typeof ZOHO === 'undefined') {
            log('ERROR: ZOHO is undefined', 'error');
        } else {
            log('ZOHO SDK loaded ✓', 'success');
            
            ZOHO.embeddedApp.on("PageLoad", function(data) {
                log('PageLoad event triggered ✓', 'success');
                log('Account ID: ' + data.EntityId);
                
                ZOHO.CRM.API.getRelatedRecords({
                    Entity: "Accounts",
                    RecordID: data.EntityId,
                    RelatedList: "Sales_Orders",
                    page: 1,
                    per_page: 10
                }).then(function(response) {
                    log('API Response received ✓', 'success');
                    log('Full Response: <pre>' + JSON.stringify(response, null, 2) + '</pre>');
                    
                    if (!response.data) {
                        log('No data in response', 'error');
                        return;
                    }
                    
                    log('Found ' + response.data.length + ' total quotations', 'success');
                    
                    response.data.forEach(function(quot, i) {
                        log('--- QUOTATION ' + (i+1) + ' ---', 'info');
                        log('ID: ' + quot.id);
                        log('Subject: ' + (quot.Subject || 'null'));
                        log('Status: ' + (quot.Status || 'null'));
                        log('Includes_eBooks: ' + quot.Includes_eBooks + ' (type: ' + typeof quot.Includes_eBooks + ')');
                        log('eBook_expiration_date: ' + (quot.eBook_expiration_date || 'null'));
                        
                        // Check the filter
                        if (quot.Status === "Accepted") {
                            log('  ✓ Status matches "Accepted"', 'success');
                        } else {
                            log('  ✗ Status does NOT match "Accepted" (got: "' + quot.Status + '")', 'error');
                        }
                        
                        if (quot.Includes_eBooks === true) {
                            log('  ✓ Includes_eBooks is TRUE', 'success');
                        } else {
                            log('  ✗ Includes_eBooks is NOT true (got: ' + quot.Includes_eBooks + ')', 'error');
                        }
                        
                        if (quot.Status === "Accepted" && quot.Includes_eBooks === true) {
                            log('  ✓✓ THIS QUOTATION SHOULD BE SHOWN!', 'success');
                        } else {
                            log('  ✗✗ This quotation will be filtered out', 'error');
                        }
                    });
                    
                }).catch(function(error) {
                    log('API Error: ' + JSON.stringify(error), 'error');
                });
            });
            
            ZOHO.embeddedApp.init();
        }
    </script>
</body>
</html>
