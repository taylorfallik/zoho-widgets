<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eBook Quotations</title>
    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            padding: 20px;
            background: #ffffff;
            color: #333;
        }
        
        .filters {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .filter-group label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
        }
        
        .filter-group select, .filter-group input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            background: white;
        }
        
        .year-section {
            margin-bottom: 30px;
        }
        
        .year-header {
            font-size: 22px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .year-count {
            font-size: 14px;
            font-weight: 600;
            color: #7f8c8d;
            background: #ecf0f1;
            padding: 4px 12px;
            border-radius: 12px;
        }
        
        .quotation-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            border-left: 5px solid #667eea;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .quotation-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
        }
        
        .quotation-card.expired {
            border-left-color: #e74c3c;
        }
        
        .quotation-card.expiring {
            border-left-color: #f39c12;
        }
        
        .quotation-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }
        
        .quotation-name {
            font-size: 18px;
            font-weight: 700;
            color: #2c3e50;
            cursor: pointer;
            flex: 1;
        }
        
        .quotation-name:hover {
            color: #667eea;
        }
        
        .status-badge {
            font-size: 11px;
            font-weight: 700;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            margin-left: 10px;
        }
        
        .status-badge.active {
            background: #27ae60;
        }
        
        .status-badge.expiring {
            background: #f39c12;
        }
        
        .status-badge.expired {
            background: #e74c3c;
        }
        
        .quotation-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .detail-item {
            font-size: 14px;
            color: #555;
        }
        
        .detail-item strong {
            color: #2c3e50;
            font-weight: 600;
            margin-right: 5px;
        }
        
        .expiration-info {
            font-size: 16px;
            font-weight: 700;
            margin-top: 8px;
            padding: 8px;
            background: #ecf0f1;
            border-radius: 4px;
        }
        
        .expiration-info.active {
            background: #d4edda;
            color: #155724;
        }
        
        .expiration-info.expiring {
            background: #fff3cd;
            color: #856404;
        }
        
        .expiration-info.expired {
            background: #f8d7da;
            color: #721c24;
        }
        
        .no-quotations {
            text-align: center;
            padding: 60px 20px;
            color: #95a5a6;
            font-size: 16px;
            font-style: italic;
        }
        
        .no-quotations:before {
            content: "📚";
            display: block;
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
            font-size: 16px;
        }
        
        .loading:after {
            content: "...";
            animation: dots 1.5s steps(4, end) infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: "."; }
            40% { content: ".."; }
            60%, 100% { content: "..."; }
        }
        
        .error {
            text-align: center;
            padding: 40px 20px;
            color: #e74c3c;
            background: #fadbd8;
            border-radius: 8px;
            font-size: 15px;
        }
        
        .stats-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            color: white;
        }
        
        .stat-item {
            flex: 1;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="stats-container"></div>
    <div id="filters-container"></div>
    <div id="quotations-container" class="loading">Loading eBook quotations</div>
    
    <script>
        let allQuotations = [];
        let filteredQuotations = [];
        
        // Wait for ZOHO to be ready
        if (typeof ZOHO === 'undefined') {
            document.getElementById("quotations-container").innerHTML = '<div class="error">Widget must be loaded within Zoho CRM</div>';
        } else {
            ZOHO.embeddedApp.on("PageLoad", function(data) {
                var accountId = data.EntityId;
                loadQuotations(accountId);
            });
            
            ZOHO.embeddedApp.init();
        }
        
        function loadQuotations(accountId) {
            var container = document.getElementById("quotations-container");
            var allQuots = [];
            
            // First, get child accounts
            ZOHO.CRM.API.searchRecord({
                Entity: "Accounts",
                Type: "criteria",
                Query: "(Parent_Account:equals:" + accountId + ")"
            }).then(function(childResponse) {
                var childAccountIds = [];
                
                if (childResponse.data && childResponse.data.length > 0) {
                    childAccountIds = childResponse.data.map(function(child) {
                        return child.id;
                    });
                }
                
                // Add the parent account ID to the list
                var accountIds = [accountId].concat(childAccountIds);
                
                // Get quotations for parent and all child accounts
                var quotationPromises = accountIds.map(function(accId) {
                    return ZOHO.CRM.API.getRelatedRecords({
                        Entity: "Accounts",
                        RecordID: accId,
                        RelatedList: "Sales_Orders",
                        page: 1,
                        per_page: 200
                    }).then(function(response) {
                        if (response.data && response.data.length > 0) {
                            return response.data;
                        }
                        return [];
                    }).catch(function() {
                        return [];
                    });
                });
                
                Promise.all(quotationPromises).then(function(quotationArrays) {
                    // Flatten all quotations into one array
                    quotationArrays.forEach(function(quotations) {
                        allQuots = allQuots.concat(quotations);
                    });
                    
                    if (allQuots.length === 0) {
                        container.innerHTML = '<div class="no-quotations">No quotations found for this account or its child accounts</div>';
                        return;
                    }
                    
                    processQuotations(allQuots);
                });
            }).catch(function(error) {
                // If child search fails, just get parent quotations
                ZOHO.CRM.API.getRelatedRecords({
                    Entity: "Accounts",
                    RecordID: accountId,
                    RelatedList: "Sales_Orders",
                    page: 1,
                    per_page: 200
                }).then(function(response) {
                    if (!response.data || response.data.length === 0) {
                        container.innerHTML = '<div class="no-quotations">No quotations found for this account</div>';
                        return;
                    }
                    
                    processQuotations(response.data);
                }).catch(function(error) {
                    container.innerHTML = '<div class="error">Error loading quotations. Please try again.</div>';
                });
            });
        }
        
        function processQuotations(quotations) {
            var quotationMap = {};
            
            quotations.forEach(function(quot) {
                // SIMPLIFIED: Only check if Includes_eBooks is true - ignore status
                if (quot.Includes_eBooks === true) {
                    var quotationDate = quot.Quotation_Date || quot.Created_Time || "";
                    var expirationDate = quot.eBook_expiration_date || "";
                    var quotationNumber = quot.Subject || quot.Quotation_Number || quot.Quote_Number || "";
                    var accountName = quot.Account_Name ? quot.Account_Name.name : "Unknown Account";
                    var accountId = quot.Account_Name ? quot.Account_Name.id : "";
                    var status = quot.Status || "Unknown";
                    
                    var expirationStatus = getExpirationStatus(expirationDate);
                    var daysRemaining = getDaysRemaining(expirationDate);
                    
                    var key = quot.id;
                    
                    if (!quotationMap[key]) {
                        quotationMap[key] = {
                            quotationId: quot.id,
                            quotationNumber: quotationNumber,
                            quotationDate: quotationDate,
                            expirationDate: expirationDate,
                            expirationStatus: expirationStatus,
                            daysRemaining: daysRemaining,
                            status: status,
                            accountName: accountName,
                            accountId: accountId,
                            fulfillmentYear: quot.Fulfillment_Year || "",
                            performanceStart: quot.Performance_Start_Date || "",
                            performanceEnd: quot.Performance_End_Date || "",
                            contactName: quot.Contact_Name ? quot.Contact_Name.name : "",
                            year: expirationDate ? expirationDate.split('-')[0] : "Unknown"
                        };
                    }
                }
            });
            
            allQuotations = Object.values(quotationMap);
            filteredQuotations = allQuotations;
            
            if (allQuotations.length === 0) {
                document.getElementById("quotations-container").innerHTML = '<div class="no-quotations">No quotations with eBooks found</div>';
                return;
            }
            
            displayQuotations();
            createFilters();
            displayStats();
        }
        
        function getExpirationStatus(dateString) {
            if (!dateString) return 'unknown';
            
            var expDate = new Date(dateString);
            var today = new Date();
            var daysUntil = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
            
            if (daysUntil < 0) return 'expired';
            if (daysUntil <= 30) return 'expiring';
            return 'active';
        }
        
        function getDaysRemaining(dateString) {
            if (!dateString) return null;
            
            var expDate = new Date(dateString);
            var today = new Date();
            var daysUntil = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
            
            return daysUntil;
        }
        
        function formatDate(dateString) {
            if (!dateString) return "No Date Set";
            try {
                return new Date(dateString).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            } catch (error) {
                return dateString;
            }
        }
        
        function displayStats() {
            var totalQuotations = allQuotations.length;
            var uniqueAccounts = new Set(allQuotations.map(q => q.accountId)).size;
            var activeCount = allQuotations.filter(q => q.expirationStatus === 'active').length;
            var expiringCount = allQuotations.filter(q => q.expirationStatus === 'expiring').length;
            var expiredCount = allQuotations.filter(q => q.expirationStatus === 'expired').length;
            
            var statsHTML = '<div class="stats-bar">';
            statsHTML += '<div class="stat-item"><div class="stat-value">' + totalQuotations + '</div><div class="stat-label">Total eBook Quotations</div></div>';
            statsHTML += '<div class="stat-item"><div class="stat-value">' + activeCount + '</div><div class="stat-label">Active</div></div>';
            statsHTML += '<div class="stat-item"><div class="stat-value">' + expiringCount + '</div><div class="stat-label">Expiring Soon</div></div>';
            statsHTML += '<div class="stat-item"><div class="stat-value">' + expiredCount + '</div><div class="stat-label">Expired</div></div>';
            statsHTML += '</div>';
            
            document.getElementById("stats-container").innerHTML = statsHTML;
        }
        
        function createFilters() {
            var years = [...new Set(allQuotations.map(q => q.year))].sort().reverse();
            var accounts = [...new Set(allQuotations.map(q => q.accountName))].sort();
            var statuses = [...new Set(allQuotations.map(q => q.status))].sort();
            
            var filtersHTML = '<div class="filters">';
            
            // Expiration Status filter
            filtersHTML += '<div class="filter-group">';
            filtersHTML += '<label>Expiration</label>';
            filtersHTML += '<select id="expirationFilter" onchange="applyFilters()">';
            filtersHTML += '<option value="">All</option>';
            filtersHTML += '<option value="active">Active</option>';
            filtersHTML += '<option value="expiring">Expiring Soon (30 days)</option>';
            filtersHTML += '<option value="expired">Expired</option>';
            filtersHTML += '</select></div>';
            
            // Quotation Status filter
            filtersHTML += '<div class="filter-group">';
            filtersHTML += '<label>Quotation Status</label>';
            filtersHTML += '<select id="statusFilter" onchange="applyFilters()">';
            filtersHTML += '<option value="">All Statuses</option>';
            statuses.forEach(function(status) {
                filtersHTML += '<option value="' + status + '">' + status + '</option>';
            });
            filtersHTML += '</select></div>';
            
            // Year filter
            filtersHTML += '<div class="filter-group">';
            filtersHTML += '<label>Year</label>';
            filtersHTML += '<select id="yearFilter" onchange="applyFilters()">';
            filtersHTML += '<option value="">All Years</option>';
            years.forEach(function(year) {
                filtersHTML += '<option value="' + year + '">' + year + '</option>';
            });
            filtersHTML += '</select></div>';
            
            // Account filter
            filtersHTML += '<div class="filter-group">';
            filtersHTML += '<label>Account</label>';
            filtersHTML += '<select id="accountFilter" onchange="applyFilters()">';
            filtersHTML += '<option value="">All Accounts</option>';
            accounts.forEach(function(name) {
                filtersHTML += '<option value="' + name + '">' + name + '</option>';
            });
            filtersHTML += '</select></div>';
            
            // Search
            filtersHTML += '<div class="filter-group">';
            filtersHTML += '<label>Search</label>';
            filtersHTML += '<input type="text" id="searchFilter" placeholder="Quotation number..." onkeyup="applyFilters()">';
            filtersHTML += '</div>';
            
            filtersHTML += '</div>';
            
            document.getElementById("filters-container").innerHTML = filtersHTML;
        }
        
        function applyFilters() {
            var expirationFilter = document.getElementById("expirationFilter").value;
            var statusFilter = document.getElementById("statusFilter").value;
            var yearFilter = document.getElementById("yearFilter").value;
            var accountFilter = document.getElementById("accountFilter").value;
            var searchFilter = document.getElementById("searchFilter").value.toLowerCase();
            
            filteredQuotations = allQuotations.filter(function(quot) {
                var matchExpiration = !expirationFilter || quot.expirationStatus === expirationFilter;
                var matchStatus = !statusFilter || quot.status === statusFilter;
                var matchYear = !yearFilter || quot.year === yearFilter;
                var matchAccount = !accountFilter || quot.accountName === accountFilter;
                var matchSearch = !searchFilter || 
                    quot.quotationNumber.toLowerCase().includes(searchFilter) ||
                    quot.accountName.toLowerCase().includes(searchFilter);
                
                return matchExpiration && matchStatus && matchYear && matchAccount && matchSearch;
            });
            
            displayQuotations();
        }
        
        function displayQuotations() {
            var container = document.getElementById("quotations-container");
            
            if (filteredQuotations.length === 0) {
                container.innerHTML = '<div class="no-quotations">No quotations match your filters</div>';
                return;
            }
            
            // Group by year
            var quotationsByYear = {};
            filteredQuotations.forEach(function(quot) {
                if (!quotationsByYear[quot.year]) {
                    quotationsByYear[quot.year] = [];
                }
                quotationsByYear[quot.year].push(quot);
            });
            
            var html = '';
            var years = Object.keys(quotationsByYear).sort().reverse();
            
            years.forEach(function(year) {
                var quotations = quotationsByYear[year];
                html += '<div class="year-section">';
                html += '<div class="year-header">';
                html += '<span>' + year + '</span>';
                html += '<span class="year-count">' + quotations.length + ' quotation' + (quotations.length !== 1 ? 's' : '') + '</span>';
                html += '</div>';
                
                quotations.forEach(function(quot) {
                    var cardClass = 'quotation-card';
                    if (quot.expirationStatus === 'expired') cardClass += ' expired';
                    if (quot.expirationStatus === 'expiring') cardClass += ' expiring';
                    
                    html += '<div class="' + cardClass + '">';
                    html += '<div class="quotation-header">';
                    html += '<div class="quotation-name" onclick="openQuotation(\'' + quot.quotationId + '\')">' + quot.quotationNumber + '</div>';
                    
                    var badgeClass = 'status-badge ' + quot.expirationStatus;
                    var badgeText = quot.expirationStatus === 'active' ? 'ACTIVE' : 
                                   quot.expirationStatus === 'expiring' ? 'EXPIRING SOON' : 'EXPIRED';
                    html += '<div class="' + badgeClass + '">' + badgeText + '</div>';
                    html += '</div>';
                    
                    html += '<div class="quotation-details">';
                    html += '<div class="detail-item"><strong>📋 Status:</strong> ' + quot.status + '</div>';
                    html += '<div class="detail-item"><strong>🏢 Account:</strong> ' + quot.accountName + '</div>';
                    html += '<div class="detail-item"><strong>📅 Quotation Date:</strong> ' + formatDate(quot.quotationDate) + '</div>';
                    if (quot.fulfillmentYear) {
                        html += '<div class="detail-item"><strong>📆 Fulfillment Year:</strong> ' + quot.fulfillmentYear + '</div>';
                    }
                    if (quot.performanceStart && quot.performanceEnd) {
                        html += '<div class="detail-item"><strong>⏱️ Performance Period:</strong> ' + formatDate(quot.performanceStart) + ' - ' + formatDate(quot.performanceEnd) + '</div>';
                    }
                    if (quot.contactName) {
                        html += '<div class="detail-item"><strong>👤 Contact:</strong> ' + quot.contactName + '</div>';
                    }
                    html += '</div>';
                    
                    var expirationClass = 'expiration-info ' + quot.expirationStatus;
                    html += '<div class="' + expirationClass + '">';
                    html += '📚 eBook Expiration: ' + formatDate(quot.expirationDate);
                    if (quot.daysRemaining !== null) {
                        var daysText = quot.daysRemaining >= 0 
                            ? ' (' + quot.daysRemaining + ' days remaining)'
                            : ' (' + Math.abs(quot.daysRemaining) + ' days overdue)';
                        html += daysText;
                    }
                    html += '</div>';
                    
                    html += '</div>';
                });
                
                html += '</div>';
            });
            
            container.innerHTML = html;
        }
        
        function openQuotation(quotationId) {
            ZOHO.CRM.UI.Record.open({Entity:"Quotes", RecordID: quotationId});
        }
    </script>
</body>
</html>
