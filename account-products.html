<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Products</title>
    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            padding: 20px;
            background: #ffffff;
            color: #333;
        }
        
        .view-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        
        .toggle-btn {
            padding: 10px 20px;
            border: 2px solid #3498db;
            background: white;
            color: #3498db;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .toggle-btn:hover {
            background: #e8f4f8;
        }
        
        .toggle-btn.active {
            background: #3498db;
            color: white;
        }
        
        .filters {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .filter-group label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
        }
        
        .filter-group select, .filter-group input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            background: white;
        }
        
        .year-section {
            margin-bottom: 30px;
        }
        
        .year-header {
            font-size: 22px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid #3498db;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .year-count {
            font-size: 14px;
            font-weight: 600;
            color: #7f8c8d;
            background: #ecf0f1;
            padding: 4px 12px;
            border-radius: 12px;
        }
        
        .product-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            border-left: 5px solid #3498db;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .product-card.member-account {
            border-left-color: #9b59b6;
        }
        
        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
        }
        
        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .product-name {
            font-size: 18px;
            font-weight: 700;
            color: #2c3e50;
            cursor: pointer;
            flex: 1;
        }
        
        .product-name:hover {
            color: #3498db;
        }
        
        .product-badges {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .product-code {
            font-size: 13px;
            font-weight: 600;
            color: #7f8c8d;
            background: #ecf0f1;
            padding: 4px 10px;
            border-radius: 12px;
        }
        
        .account-badge {
            font-size: 11px;
            font-weight: 700;
            color: white;
            background: #3498db;
            padding: 4px 10px;
            border-radius: 12px;
            text-transform: uppercase;
        }
        
        .account-badge.member {
            background: #9b59b6;
        }
        
        .product-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .detail-item {
            font-size: 14px;
            color: #555;
        }
        
        .detail-item strong {
            color: #2c3e50;
            font-weight: 600;
            margin-right: 5px;
        }
        
        .no-products {
            text-align: center;
            padding: 60px 20px;
            color: #95a5a6;
            font-size: 16px;
            font-style: italic;
        }
        
        .no-products:before {
            content: "📦";
            display: block;
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
            font-size: 16px;
        }
        
        .loading:after {
            content: "...";
            animation: dots 1.5s steps(4, end) infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: "."; }
            40% { content: ".."; }
            60%, 100% { content: "..."; }
        }
        
        .error {
            text-align: center;
            padding: 40px 20px;
            color: #e74c3c;
            background: #fadbd8;
            border-radius: 8px;
            font-size: 15px;
        }
        
        .stats-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            border-radius: 8px;
            color: white;
        }
        
        .stat-item {
            flex: 1;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="view-toggle-container"></div>
    <div id="stats-container"></div>
    <div id="filters-container"></div>
    <div id="products-container" class="loading">Loading products</div>
    
    <script>
        let allProducts = [];
        let filteredProducts = [];
        let currentView = 'all'; // 'all', 'parent', 'member'
        let parentAccountId = null;
        
        // Wait for ZOHO to be ready
        if (typeof ZOHO === 'undefined') {
            document.getElementById("products-container").innerHTML = '<div class="error">Widget must be loaded within Zoho CRM</div>';
        } else {
            ZOHO.embeddedApp.on("PageLoad", function(data) {
                parentAccountId = data.EntityId;
                loadProducts(parentAccountId);
            });
            
            ZOHO.embeddedApp.init();
        }
        
        function loadProducts(accountId) {
            var container = document.getElementById("products-container");
            var allInvoices = [];
            var accountMap = {}; // Track which invoices belong to which account
            
            // First, get child accounts
            ZOHO.CRM.API.searchRecord({
                Entity: "Accounts",
                Type: "criteria",
                Query: "(Parent_Account:equals:" + accountId + ")"
            }).then(function(childResponse) {
                var childAccountIds = [];
                
                if (childResponse.data && childResponse.data.length > 0) {
                    childAccountIds = childResponse.data.map(function(child) {
                        accountMap[child.id] = { name: child.Account_Name, isParent: false };
                        return child.id;
                    });
                }
                
                // Mark parent account
                accountMap[accountId] = { name: 'Parent Account', isParent: true };
                
                // Add the parent account ID to the list
                var accountIds = [accountId].concat(childAccountIds);
                
                // Get invoices for parent and all child accounts
                var invoicePromises = accountIds.map(function(accId) {
                    return ZOHO.CRM.API.getRelatedRecords({
                        Entity: "Accounts",
                        RecordID: accId,
                        RelatedList: "Invoices",
                        page: 1,
                        per_page: 200
                    }).then(function(response) {
                        if (response.data && response.data.length > 0) {
                            // Tag each invoice with its source account
                            response.data.forEach(function(inv) {
                                inv._sourceAccountId = accId;
                                inv._isFromParent = accountMap[accId].isParent;
                            });
                            return response.data;
                        }
                        return [];
                    }).catch(function() {
                        return [];
                    });
                });
                
                Promise.all(invoicePromises).then(function(invoiceArrays) {
                    // Flatten all invoices into one array
                    invoiceArrays.forEach(function(invoices) {
                        allInvoices = allInvoices.concat(invoices);
                    });
                    
                    if (allInvoices.length === 0) {
                        container.innerHTML = '<div class="no-products">No invoices found for this account or its child accounts</div>';
                        return;
                    }
                    
                    processInvoices(allInvoices);
                });
            }).catch(function(error) {
                // If child search fails, just get parent invoices
                ZOHO.CRM.API.getRelatedRecords({
                    Entity: "Accounts",
                    RecordID: accountId,
                    RelatedList: "Invoices",
                    page: 1,
                    per_page: 200
                }).then(function(response) {
                    if (!response.data || response.data.length === 0) {
                        container.innerHTML = '<div class="no-products">No invoices found for this account</div>';
                        return;
                    }
                    
                    // Tag parent invoices
                    response.data.forEach(function(inv) {
                        inv._isFromParent = true;
                    });
                    processInvoices(response.data);
                }).catch(function(error) {
                    container.innerHTML = '<div class="error">Error loading invoices. Please try again.</div>';
                });
            });
        }
        
        function processInvoices(invoices) {
            var allowedStatuses = ["Paid", "Being Processed", "NET 30 Email 1 Sent", "NET 30 Email 2 Sent", 
                                   "NET 30 Email 3 Sent", "Overdue", "Invoice Sent", "Reissue Invoice w/ PO", 
                                   "Invoice Reissued w/ PO"];
            
            var productMap = {};
            var promises = [];
            
            invoices.forEach(function(invoice) {
                if (!allowedStatuses.includes(invoice.Status)) return;
                
                var invoiceNumber = invoice.Invoice_No || invoice.Subject || "";
                var invoiceDate = invoice.Invoice_Date || (invoice.Created_Time ? new Date(invoice.Created_Time).toISOString().split('T')[0] : "");
                var quotationNumber = invoice.Quotation_Number || "No Quotation";
                var dealName = invoice.Deal_Name__s ? invoice.Deal_Name__s.name : "";
                var accountName = invoice.Account_Name ? invoice.Account_Name.name : "Unknown Account";
                var accountId = invoice.Account_Name ? invoice.Account_Name.id : "";
                var isFromParent = invoice._isFromParent !== undefined ? invoice._isFromParent : true;
                
                if (invoice.Product_Details && invoice.Product_Details.length > 0) {
                    invoice.Product_Details.forEach(function(lineItem) {
                        if (lineItem.product) {
                            var productId = lineItem.product.id;
                            
                            // Fetch full product details
                            var promise = ZOHO.CRM.API.getRecord({
                                Entity: "Products",
                                RecordID: productId
                            }).then(function(prodResponse) {
                                var product = prodResponse.data[0];
                                var key = productId + "_" + invoiceNumber + "_" + quotationNumber + "_" + accountId;
                                
                                if (!productMap[key]) {
                                    productMap[key] = {
                                        productId: productId,
                                        productName: lineItem.product.name || "Unnamed Product",
                                        productCode: product.Product_Code || "",
                                        invoiceNumber: invoiceNumber,
                                        invoiceDate: invoiceDate,
                                        quotationNumber: quotationNumber,
                                        dealName: dealName,
                                        accountName: accountName,
                                        accountId: accountId,
                                        isFromParent: isFromParent,
                                        year: invoiceDate ? invoiceDate.split('-')[0] : "Unknown"
                                    };
                                }
                            }).catch(function(error) {
                                // Silently handle product fetch errors
                            });
                            
                            promises.push(promise);
                        }
                    });
                }
            });
            
            Promise.all(promises).then(function() {
                allProducts = Object.values(productMap);
                filteredProducts = allProducts;
                createViewToggle();
                displayProducts();
                createFilters();
                displayStats();
            });
        }
        
        function createViewToggle() {
            var parentCount = allProducts.filter(p => p.isFromParent).length;
            var memberCount = allProducts.filter(p => !p.isFromParent).length;
            
            var html = '<div class="view-toggle">';
            html += '<button class="toggle-btn active" onclick="changeView(\'all\')">All Accounts (' + allProducts.length + ')</button>';
            html += '<button class="toggle-btn" onclick="changeView(\'parent\')">Main Account Only (' + parentCount + ')</button>';
            html += '<button class="toggle-btn" onclick="changeView(\'member\')">Member Accounts Only (' + memberCount + ')</button>';
            html += '</div>';
            
            document.getElementById("view-toggle-container").innerHTML = html;
        }
        
        function changeView(view) {
            currentView = view;
            
            // Update button states
            var buttons = document.querySelectorAll('.toggle-btn');
            buttons.forEach(function(btn) {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            applyFilters();
        }
        
        function displayStats() {
            var totalProducts = filteredProducts.length;
            var uniqueProducts = new Set(filteredProducts.map(p => p.productId)).size;
            var years = new Set(filteredProducts.map(p => p.year)).size;
            var parentCount = filteredProducts.filter(p => p.isFromParent).length;
            var memberCount = filteredProducts.filter(p => !p.isFromParent).length;
            var uniqueAccounts = new Set(filteredProducts.map(p => p.accountId)).size;
            
            var statsHTML = '<div class="stats-bar">';
            statsHTML += '<div class="stat-item"><div class="stat-value">' + totalProducts + '</div><div class="stat-label">Total Purchases</div></div>';
            statsHTML += '<div class="stat-item"><div class="stat-value">' + uniqueProducts + '</div><div class="stat-label">Unique Products</div></div>';
            statsHTML += '<div class="stat-item"><div class="stat-value">' + uniqueAccounts + '</div><div class="stat-label">Accounts</div></div>';
            statsHTML += '<div class="stat-item"><div class="stat-value">' + parentCount + ' / ' + memberCount + '</div><div class="stat-label">Parent / Member</div></div>';
            statsHTML += '<div class="stat-item"><div class="stat-value">' + years + '</div><div class="stat-label">Years</div></div>';
            statsHTML += '</div>';
            
            document.getElementById("stats-container").innerHTML = statsHTML;
        }
        
        function createFilters() {
            var years = [...new Set(allProducts.map(p => p.year))].sort().reverse();
            var productNames = [...new Set(allProducts.map(p => p.productName))].sort();
            var accountNames = [...new Set(allProducts.map(p => p.accountName))].sort();
            
            var filtersHTML = '<div class="filters">';
            
            // Year filter
            filtersHTML += '<div class="filter-group">';
            filtersHTML += '<label>Year</label>';
            filtersHTML += '<select id="yearFilter" onchange="applyFilters()">';
            filtersHTML += '<option value="">All Years</option>';
            years.forEach(function(year) {
                filtersHTML += '<option value="' + year + '">' + year + '</option>';
            });
            filtersHTML += '</select></div>';
            
            // Account filter
            filtersHTML += '<div class="filter-group">';
            filtersHTML += '<label>Account</label>';
            filtersHTML += '<select id="accountFilter" onchange="applyFilters()">';
            filtersHTML += '<option value="">All Accounts</option>';
            accountNames.forEach(function(name) {
                filtersHTML += '<option value="' + name + '">' + name + '</option>';
            });
            filtersHTML += '</select></div>';
            
            // Product filter
            filtersHTML += '<div class="filter-group">';
            filtersHTML += '<label>Product</label>';
            filtersHTML += '<select id="productFilter" onchange="applyFilters()">';
            filtersHTML += '<option value="">All Products</option>';
            productNames.forEach(function(name) {
                filtersHTML += '<option value="' + name + '">' + name + '</option>';
            });
            filtersHTML += '</select></div>';
            
            // Search
            filtersHTML += '<div class="filter-group">';
            filtersHTML += '<label>Search</label>';
            filtersHTML += '<input type="text" id="searchFilter" placeholder="Invoice, Quotation, Deal..." onkeyup="applyFilters()">';
            filtersHTML += '</div>';
            
            filtersHTML += '</div>';
            
            document.getElementById("filters-container").innerHTML = filtersHTML;
        }
        
        function applyFilters() {
            var yearFilter = document.getElementById("yearFilter") ? document.getElementById("yearFilter").value : "";
            var accountFilter = document.getElementById("accountFilter") ? document.getElementById("accountFilter").value : "";
            var productFilter = document.getElementById("productFilter") ? document.getElementById("productFilter").value : "";
            var searchFilter = document.getElementById("searchFilter") ? document.getElementById("searchFilter").value.toLowerCase() : "";
            
            filteredProducts = allProducts.filter(function(product) {
                // View filter
                var matchView = currentView === 'all' || 
                               (currentView === 'parent' && product.isFromParent) ||
                               (currentView === 'member' && !product.isFromParent);
                
                var matchYear = !yearFilter || product.year === yearFilter;
                var matchAccount = !accountFilter || product.accountName === accountFilter;
                var matchProduct = !productFilter || product.productName === productFilter;
                var matchSearch = !searchFilter || 
                    product.invoiceNumber.toLowerCase().includes(searchFilter) ||
                    product.quotationNumber.toLowerCase().includes(searchFilter) ||
                    product.dealName.toLowerCase().includes(searchFilter) ||
                    product.productName.toLowerCase().includes(searchFilter) ||
                    product.accountName.toLowerCase().includes(searchFilter);
                
                return matchView && matchYear && matchAccount && matchProduct && matchSearch;
            });
            
            displayProducts();
            displayStats();
        }
        
        function displayProducts() {
            var container = document.getElementById("products-container");
            
            if (filteredProducts.length === 0) {
                container.innerHTML = '<div class="no-products">No products match your filters</div>';
                return;
            }
            
            // Group by year
            var productsByYear = {};
            filteredProducts.forEach(function(product) {
                if (!productsByYear[product.year]) {
                    productsByYear[product.year] = [];
                }
                productsByYear[product.year].push(product);
            });
            
            var html = '';
            var years = Object.keys(productsByYear).sort().reverse();
            
            years.forEach(function(year) {
                var products = productsByYear[year];
                html += '<div class="year-section">';
                html += '<div class="year-header">';
                html += '<span>' + year + '</span>';
                html += '<span class="year-count">' + products.length + ' product' + (products.length !== 1 ? 's' : '') + '</span>';
                html += '</div>';
                
                products.forEach(function(product) {
                    var cardClass = product.isFromParent ? 'product-card' : 'product-card member-account';
                    html += '<div class="' + cardClass + '">';
                    html += '<div class="product-header">';
                    html += '<div class="product-name" onclick="openProduct(\'' + product.productId + '\')">' + product.productName + '</div>';
                    html += '<div class="product-badges">';
                    if (product.productCode) {
                        html += '<div class="product-code">' + product.productCode + '</div>';
                    }
                    var badgeClass = product.isFromParent ? 'account-badge' : 'account-badge member';
                    var badgeText = product.isFromParent ? 'PARENT' : 'MEMBER';
                    html += '<div class="' + badgeClass + '">' + badgeText + '</div>';
                    html += '</div>';
                    html += '</div>';
                    
                    html += '<div class="product-details">';
                    html += '<div class="detail-item"><strong>🏢 Account:</strong> ' + product.accountName + '</div>';
                    html += '<div class="detail-item"><strong>📅 Invoice Date:</strong> ' + (product.invoiceDate || '-') + '</div>';
                    html += '<div class="detail-item"><strong>📄 Invoice No:</strong> ' + (product.invoiceNumber || '-') + '</div>';
                    html += '<div class="detail-item"><strong>📋 Quotation:</strong> ' + product.quotationNumber + '</div>';
                    if (product.dealName) {
                        html += '<div class="detail-item"><strong>💼 Deal:</strong> ' + product.dealName + '</div>';
                    }
                    html += '</div>';
                    
                    html += '</div>';
                });
                
                html += '</div>';
            });
            
            container.innerHTML = html;
        }
        
        function openProduct(productId) {
            ZOHO.CRM.UI.Record.open({Entity:"Products", RecordID: productId});
        }
    </script>
</body>
</html>
