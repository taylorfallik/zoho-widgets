<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Account Products</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 900px;
        }
        .header {
            background: #4a90e2;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }
        .view-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .toggle-btn {
            padding: 8px 16px;
            border: 2px solid #4a90e2;
            background: white;
            color: #4a90e2;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .toggle-btn.active {
            background: #4a90e2;
            color: white;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            flex: 1;
        }
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #4a90e2;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        .account-section {
            margin-bottom: 30px;
        }
        .account-header {
            background: #e9ecef;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .account-name {
            font-weight: bold;
            font-size: 16px;
            color: #333;
        }
        .account-type {
            background: #4a90e2;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .member-badge {
            background: #6c757d;
        }
        .product {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            background: #fafafa;
        }
        .product-name {
            font-weight: bold;
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
        }
        .product-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 14px;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
        }
        .label {
            font-weight: bold;
            color: #666;
        }
        .value {
            color: #333;
        }
        .status {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .status-active {
            background: #d4edda;
            color: #155724;
        }
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        .search-box {
            margin-bottom: 20px;
        }
        .search-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Purchased Products</h2>
            <div id="main-account-name">Loading account...</div>
        </div>

        <div class="view-toggle">
            <button class="toggle-btn active" id="btn-all" onclick="changeView('all')">
                All Accounts
            </button>
            <button class="toggle-btn" id="btn-main" onclick="changeView('main')">
                Main Account Only
            </button>
            <button class="toggle-btn" id="btn-members" onclick="changeView('members')">
                Member Accounts Only
            </button>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-number" id="total-products">0</div>
                <div class="stat-label">Total Products</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="total-accounts">0</div>
                <div class="stat-label">Accounts</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="total-value">$0</div>
                <div class="stat-label">Total Value</div>
            </div>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search products, accounts, quotations..." id="search">
        </div>

        <div id="products-container">
            <div class="loading">Loading products...</div>
        </div>
    </div>

    <script>
        console.log('Widget with member accounts loaded');

        let currentView = 'all';
        let mainAccountData = null;
        let memberAccountsData = [];
        let allProductsData = {
            main: [],
            members: []
        };

        // Sample data structure
        const sampleData = {
            mainAccount: {
                id: '12345',
                name: 'ACME Corporation',
                products: [
                    {
                        name: "Enterprise Software License",
                        proposal: "ACME Corp Q1 Package",
                        quotation: "QUO-2024-001",
                        quantity: "50",
                        value: "$125,000",
                        period: "Jan 2024 - Jan 2025",
                        status: "active"
                    },
                    {
                        name: "Cloud Storage Premium",
                        proposal: "ACME Infrastructure",
                        quotation: "QUO-2024-002",
                        quantity: "5 TB",
                        value: "$6,000",
                        period: "Mar 2024 - Feb 2025",
                        status: "active"
                    }
                ]
            },
            memberAccounts: [
                {
                    id: '12346',
                    name: 'ACME East Region',
                    products: [
                        {
                            name: "Professional Services",
                            proposal: "East Region Implementation",
                            quotation: "QUO-2024-003",
                            quantity: "80 hours",
                            value: "$12,000",
                            period: "Feb 2024 - Apr 2024",
                            status: "active"
                        }
                    ]
                },
                {
                    id: '12347',
                    name: 'ACME West Region',
                    products: [
                        {
                            name: "Support Package",
                            proposal: "West Region Support",
                            quotation: "QUO-2024-004",
                            quantity: "12 months",
                            value: "$8,000",
                            period: "Jan 2024 - Dec 2024",
                            status: "pending"
                        }
                    ]
                }
            ]
        };

        function init() {
            try {
                if (typeof ZOHO !== 'undefined' && ZOHO.CRM && ZOHO.CRM.UI) {
                    loadRealData();
                } else {
                    loadSampleData();
                }
            } catch (error) {
                console.log('Error initializing:', error);
                loadSampleData();
            }

            setupSearch();
        }

        async function loadRealData() {
            try {
                // Get current account
                const accountData = await ZOHO.CRM.UI.Record.get();
                if (accountData && accountData.data && accountData.data[0]) {
                    mainAccountData = accountData.data[0];
                    document.getElementById('main-account-name').textContent = 
                        'Account: ' + mainAccountData.Account_Name;

                    // Fetch main account products
                    await fetchAccountProducts(mainAccountData.id, true);

                    // Fetch member accounts
                    await fetchMemberAccounts(mainAccountData.id);

                    displayAll();
                }
            } catch (error) {
                console.log('Error loading real data:', error);
                loadSampleData();
            }
        }

        async function fetchMemberAccounts(parentAccountId) {
            try {
                // Query for member accounts where Parent Account = current account
                const response = await ZOHO.CRM.API.searchRecord({
                    Entity: "Accounts",
                    Type: "criteria",
                    Query: `(Parent_Account.id:equals:${parentAccountId})`
                });

                if (response.data) {
                    for (const memberAccount of response.data) {
                        await fetchAccountProducts(memberAccount.id, false, memberAccount.Account_Name);
                    }
                }
            } catch (error) {
                console.log('Error fetching member accounts:', error);
            }
        }

        async function fetchAccountProducts(accountId, isMain, accountName) {
            try {
                // Fetch quotations for this account
                const response = await ZOHO.CRM.API.searchRecord({
                    Entity: "Quotations",
                    Type: "criteria",
                    Query: `(Account_Name.id:equals:${accountId})`
                });

                if (response.data) {
                    const products = response.data.map(quot => ({
                        accountId: accountId,
                        accountName: accountName || (isMain ? mainAccountData.Account_Name : 'Unknown'),
                        name: quot.Subject || 'Unnamed Product',
                        proposal: quot.Proposal_Name || 'N/A',
                        quotation: quot.Quote_Number || 'N/A',
                        quantity: '1',
                        value: '$' + (quot.Grand_Total || 0).toLocaleString(),
                        period: quot.Period_Start_Date && quot.Period_End_Date 
                            ? `${formatDate(quot.Period_Start_Date)} - ${formatDate(quot.Period_End_Date)}`
                            : 'TBD',
                        status: quot.Quote_Stage === 'Closed Won' ? 'active' : 'pending'
                    }));

                    if (isMain) {
                        allProductsData.main = products;
                    } else {
                        allProductsData.members.push({
                            accountId: accountId,
                            accountName: accountName,
                            products: products
                        });
                    }
                }
            } catch (error) {
                console.log('Error fetching products for account:', accountId, error);
            }
        }

        function loadSampleData() {
            document.getElementById('main-account-name').textContent = 
                'Account: ' + sampleData.mainAccount.name + ' (Demo Mode)';
            
            allProductsData.main = sampleData.mainAccount.products;
            allProductsData.members = sampleData.memberAccounts.map(acc => ({
                accountId: acc.id,
                accountName: acc.name,
                products: acc.products
            }));

            displayAll();
        }

        function changeView(view) {
            currentView = view;
            
            // Update button states
            document.getElementById('btn-all').classList.toggle('active', view === 'all');
            document.getElementById('btn-main').classList.toggle('active', view === 'main');
            document.getElementById('btn-members').classList.toggle('active', view === 'members');

            displayAll();
        }

        function displayAll() {
            const container = document.getElementById('products-container');
            let html = '';

            // Display main account products
            if (currentView === 'all' || currentView === 'main') {
                if (allProductsData.main && allProductsData.main.length > 0) {
                    html += `
                        <div class="account-section">
                            <div class="account-header">
                                <span class="account-name">${mainAccountData ? mainAccountData.Account_Name : sampleData.mainAccount.name}</span>
                                <span class="account-type">MAIN ACCOUNT</span>
                            </div>
                            ${renderProducts(allProductsData.main)}
                        </div>
                    `;
                }
            }

            // Display member accounts products
            if (currentView === 'all' || currentView === 'members') {
                allProductsData.members.forEach(member => {
                    if (member.products && member.products.length > 0) {
                        html += `
                            <div class="account-section">
                                <div class="account-header">
                                    <span class="account-name">${member.accountName}</span>
                                    <span class="account-type member-badge">MEMBER ACCOUNT</span>
                                </div>
                                ${renderProducts(member.products)}
                            </div>
                        `;
                    }
                });
            }

            if (html === '') {
                html = '<div class="no-data">No products found</div>';
            }

            container.innerHTML = html;
            updateStats();
        }

        function renderProducts(products) {
            return products.map(product => `
                <div class="product">
                    <div class="product-name">${product.name}</div>
                    <div class="product-info">
                        <div class="info-item">
                            <span class="label">Proposal:</span>
                            <span class="value">${product.proposal}</span>
                        </div>
                        <div class="info-item">
                            <span class="label">Quotation:</span>
                            <span class="value">${product.quotation}</span>
                        </div>
                        <div class="info-item">
                            <span class="label">Quantity:</span>
                            <span class="value">${product.quantity}</span>
                        </div>
                        <div class="info-item">
                            <span class="label">Value:</span>
                            <span class="value">${product.value}</span>
                        </div>
                        <div class="info-item">
                            <span class="label">Period:</span>
                            <span class="value">${product.period}</span>
                        </div>
                        <div class="info-item">
                            <span class="label">Status:</span>
                            <span class="status status-${product.status}">${product.status}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            let totalProducts = 0;
            let totalValue = 0;
            let accountCount = 0;

            if (currentView === 'all' || currentView === 'main') {
                totalProducts += allProductsData.main.length;
                if (allProductsData.main.length > 0) accountCount++;
                allProductsData.main.forEach(p => {
                    const val = parseInt(p.value.replace(/[$,]/g, ''));
                    if (!isNaN(val)) totalValue += val;
                });
            }

            if (currentView === 'all' || currentView === 'members') {
                allProductsData.members.forEach(member => {
                    totalProducts += member.products.length;
                    if (member.products.length > 0) accountCount++;
                    member.products.forEach(p => {
                        const val = parseInt(p.value.replace(/[$,]/g, ''));
                        if (!isNaN(val)) totalValue += val;
                    });
                });
            }

            document.getElementById('total-products').textContent = totalProducts;
            document.getElementById('total-accounts').textContent = accountCount;
            document.getElementById('total-value').textContent = '$' + totalValue.toLocaleString();
        }

        function setupSearch() {
            document.getElementById('search').addEventListener('input', function(e) {
                const searchTerm = e.target.value.toLowerCase();
                const products = document.querySelectorAll('.product');
                
                products.forEach(function(product) {
                    const text = product.textContent.toLowerCase();
                    if (text.includes(searchTerm)) {
                        product.style.display = 'block';
                    } else {
                        product.style.display = 'none';
                    }
                });
            });
        }

        function formatDate(dateString) {
            try {
                return new Date(dateString).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
            } catch (error) {
                return dateString;
            }
        }

        // Initialize on load
        window.addEventListener('load', init);
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
